<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - NLI8 Mentor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .background-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite;
        }

        .bubble:nth-child(1) {
            width: 60px;
            height: 60px;
            left: 10%;
            animation-duration: 25s;
        }

        .bubble:nth-child(2) {
            width: 100px;
            height: 100px;
            left: 20%;
            animation-duration: 30s;
            animation-delay: 5s;
        }

        .bubble:nth-child(3) {
            width: 80px;
            height: 80px;
            left: 50%;
            animation-duration: 28s;
            animation-delay: 10s;
        }

        .bubble:nth-child(4) {
            width: 120px;
            height: 120px;
            right: 10%;
            animation-duration: 35s;
            animation-delay: 8s;
        }

        .bubble:nth-child(5) {
            width: 70px;
            height: 70px;
            right: 30%;
            animation-duration: 26s;
            animation-delay: 15s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main content container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo styling */
        .logo-container {
            margin-bottom: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            overflow: hidden;
            background: white;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Typography */
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 15px;
            animation: fadeInDown 0.8s ease-out 0.2s both;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading animation */
        .loading-animation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 30px 0;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Contact info */
        .contact-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .contact-info p {
            color: #666;
            font-size: 0.95em;
            line-height: 1.8;
        }

        .social-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .social-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
<!-- Animated background -->
<div class="background-animation">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<!-- Main content -->
<div class="container">
    <!-- Logo -->
    <div class="logo-container">
        <div class="logo">
            <img src="logo.jpeg" alt="nli8mentor Logo">
        </div>
    </div>

    <!-- Heading -->
    <h1>We're Under Construction</h1>

    <!-- Subtitle -->
    <p class="subtitle">Something amazing is coming your way! We're working hard to bring you an extraordinary experience.</p>

    <!-- Loading animation -->
    <div class="loading-animation">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- Contact information -->
    <div class="contact-info">
        <p>In the meantime, feel free to reach out to us</p>

        <!-- Social links -->
        <div class="social-links">
            <a href="mailto:sale@nli8mentor.in" class="social-link" title="Email us">✉️</a>
<!--            <a href="https://linkedin.com" class="social-link" target="_blank" title="LinkedIn">in</a>-->
<!--            <a href="https://twitter.com" class="social-link" target="_blank" title="Twitter">𝕏</a>-->
<!--            <a href="https://facebook.com" class="social-link" target="_blank" title="Facebook">f</a>-->
        </div>

        <p style="margin-top: 20px; font-size: 0.9em; color: #999;">
            ©️ 2025 Nli8 Mentor. All rights reserved.
        </p>
    </div>
</div>
</body>
</html>
